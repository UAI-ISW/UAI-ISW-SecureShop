{% extends "base.html" %}
{% block title %}Tienda{% endblock %}
{% block content %}
<h1>Tienda</h1>
<div class="grid">
    {% for producto in productos %}
    <div class="card">
        <h2>{{ producto.nombre }}</h2>
        <p class="precio">${{ "{:,}".format(producto.precio) }}</p>
        <a class="btn" href="{{ url_for('agregar_producto', producto_id=producto.id) }}">Agregar al carrito</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
