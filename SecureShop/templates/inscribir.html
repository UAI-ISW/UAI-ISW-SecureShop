{% extends "base.html" %}
{% block title %}Inscribir mascota{% endblock %}
{% block content %}
<h1>Inscribir mascota</h1>
<form class="card" method="POST" enctype="multipart/form-data">
    <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>
    </div>
    <div class="campo">
        <label for="rut">RUT del dueño</label>
        <input type="text" id="rut" name="rut" required>
    </div>
    <div class="campo">
        <label for="chip">Chip</label>
        <input type="text" id="chip" name="chip">
    </div>
    <div class="campo">
        <label for="edad">Edad</label>
        <input type="text" id="edad" name="edad" required>
    </div>
    <div class="campo">
        <label for="color">Color</label>
        <input type="text" id="color" name="color" required>
    </div>
    <div class="campo">
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo" required>
            <option value="">Seleccione un tipo</option>
            <option value="Perro">Perro</option>
            <option value="Gato">Gato</option>
            <option value="Ave">Ave</option>
            <option value="Otro">Otro</option>
        </select>
    </div>
    <div class="campo">
        <label for="imagen">Foto</label>
        <input type="file" id="imagen" name="imagen" accept="image/jpeg,image/png,image/gif,image/webp">
    </div>
    <button class="btn verde" type="submit">Registrar</button>
</form>
{% endblock %}
