name: CI

on:
  push:
    branches: [main, sprint-1, sprint-2, sprint-3]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r SecureShop/requirements-dev.txt
      - name: pytest (unidad, hallazgos que se conservan, aceptación)
        working-directory: SecureShop
        run: python -m pytest -q
